<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Cart - Baking Mellow</title>

<style>
body{
  margin:0;
  font-family:Georgia, serif;
  background:#fff8f2;
}

/* NAVBAR */
.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 40px;
  background:#fff;
  box-shadow:0 2px 10px #00000015;
  position:sticky;
  top:0;
  z-index:1000;
}

.nav-left{
  display:flex;
  align-items:center;
  gap:22px;
}

.logo img{
  height:55px;
}

.nav-left a{
  text-decoration:none;
  color:#5c4636;
  font-size:17px;
  font-weight:bold;
  transition:0.3s;
}

.nav-left a:hover{
  color:#b69b72;
}

.nav-right{
  display:flex;
  align-items:center;
  gap:18px;
  font-size:22px;
}

.nav-right a{
  text-decoration:none;
  color:#5c4636;
  transition:0.3s;
}

.nav-right a:hover{
  color:#b69b72;
}
.active{
  color:#b69b72;
  border-bottom:2px solid #b69b72;
}




/* TITLE */
h1{
  text-align:center;
  margin:40px 0;
  color:#5c4636;
}

/* TABLE */
table{
  width:80%;
  margin:auto;
  border-collapse:collapse;
  background:#fff;
  box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

th, td{
  padding:15px;
  text-align:center;
  border-bottom:1px solid #eee;
}

th{
  background:#b69b72;
  color:white;
}

/* REMOVE */
.remove{
  color:red;
  cursor:pointer;
  font-weight:bold;
}

/* TOTAL */
.total{
  width:80%;
  margin:30px auto;
  text-align:right;
  font-size:22px;
  color:#4b2e2e;
}

/* CHECKOUT */
.checkout{
  display:block;
  width:220px;
  margin:30px auto;
  padding:12px;
  background:#b69b72;
  color:white;
  text-align:center;
  text-decoration:none;
  border-radius:8px;
}

.checkout:hover{
  background:#8b6a4f;
}
</style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">
  <div class="nav-left">
    <a href="home.html" class="logo">
      <img src="logo.jpg" alt="BakingMellow">
    </a>

    <a href="home.html">Home</a>
    <a href="menu.html" class="active">Menu</a>
    <a href="about.html">About Us</a>
    <a href="social.html">Social Media</a>
    <a href="order.html">Orders</a>
    <a href="contact.html">Contact Us</a>
	
  </div>

  <div class="nav-right">
    <a href="signup.html" title="Sign In">👤</a>
    <a href="login.html" title="Login">🔑</a>
    <a href="cart.html" title="Cart">🛒</a>
  </div>
</div>

  

<h1>🛒 Your Cart</h1>

<table>
<thead>
<tr>
  <th>Product</th>
  <th>Option</th>
  <th>Qty</th>
  <th>Price</th>
  <th>Remove</th>
</tr>
</thead>
<tbody id="cartItems">
</tbody>
</table>

<div class="total">
  Total: Rs <span id="totalPrice">0</span>
</div>

<a href="checkout.html" class="checkout">Proceed to Checkout</a>

<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
let tbody = document.getElementById("cartItems");
let total = 0;

if(cart.length === 0){
  tbody.innerHTML = `
    <tr>
      <td colspan="5">Your cart is empty 😢</td>
    </tr>
  `;
}

cart.forEach((item, index) => {
  let row = document.createElement("tr");
  let itemTotal = item.price * item.qty;
  total += itemTotal;

  row.innerHTML = `
    <td>${item.name}</td>
    <td>${item.option}</td>
    <td>${item.qty}</td>
    <td>Rs ${itemTotal}</td>
    <td class="remove" onclick="removeItem(${index})">✖</td>
  `;

  tbody.appendChild(row);
});

document.getElementById("totalPrice").innerText = total;

function removeItem(index){
  cart.splice(index,1);
  localStorage.setItem("cart", JSON.stringify(cart));
  location.reload();
}
</script>

</body>
</html>
